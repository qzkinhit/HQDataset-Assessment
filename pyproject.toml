[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hqd-assess"
version = "1.0.0"
description = "Graded quality assessment of datasets"
requires-python = ">=3.8"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.22", "scipy>=1.8"]

[tool.setuptools]
packages = ["hqd_assess"]

[tool.pytest.ini_options]
testpaths = ["tests"]
